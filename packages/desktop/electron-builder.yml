# Called by scripts/dist.mjs, it will first generate the app/ directory. Before running electron-builder directly, you need to run node scripts/build.mjs --stage first.
appId: com.xtongs.repolens
productName: RepoLens
copyright: Copyright © 2026 Tong
directories:
  app: app
  output: release
  buildResources: build
# The service process needs to start worker threads, read wasm by path, and put it into asar, all requiring detours; not packaging just means having a few hundred more small files.
asar: false
# better-sqlite3 uses N-API precompiled binaries, which are already included for each platform in the package, so there is no need to recompile specifically for Electron.
npmRebuild: false
nodeGypRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: xtongs
  repo: repolens
  # Upload the tasks from all three platforms into the same draft, and click publish manually after everything is completed.
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # The automatic update check needs to read the latest-mac.yml generated by the zip
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  files:
    - "!node_modules/better-sqlite3/prebuilds/!(darwin-${arch}).node"
dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
  files:
    - "!node_modules/better-sqlite3/prebuilds/!(win32-${arch}).node"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

linux:
  category: Development
  executableName: repolens
  synopsis: 本地代码仓库理解工具
  maintainer: Tong <xtongs@gmail.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  files:
    - "!node_modules/better-sqlite3/prebuilds/!(linux-${arch}|linuxmusl-${arch}).node"
